name: Actualizar calidad del aire

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

concurrency:
  group: calidad-aire
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install geopandas pandas numpy requests scipy shapely

      - name: Ejecutar script
        env:
          API_KEY_PURPLEAIR: ${{ secrets.API_KEY_PURPLEAIR }}
        run: python script.py

      - name: Guardar resultados en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sensores.geojson AQ_PM25_v2.geojson AQ_PM10.geojson historico/
          if git diff --cached --quiet; then
            echo "Sin cambios que guardar"
            exit 0
          fi
          git commit -m "Actualización $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin "${{ github.ref_name }}"
          git push